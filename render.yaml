services:
  - type: web
    name: tasseer-ai-support
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TASSEER_DB_HOST
        sync: false
      - key: TASSEER_DB_PORT
        value: "3306"
      - key: TASSEER_DB_NAME
        sync: false
      - key: TASSEER_DB_USER
        sync: false
      - key: TASSEER_DB_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: TASSEER_API_BASE_URL
        value: https://api.ksatasseerltdapi.com
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_SUPPORT_PHONE_E164
        sync: false
